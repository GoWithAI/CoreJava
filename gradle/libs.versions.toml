[versions]
springBoot        = "3.5.16"
springKafka       = "3.3.2"
springRabbit      = "3.2.0"
awsSdk            = "2.27.21"
googleCloudStorage = "2.29.0"
azureStorageBlob  = "12.28.1"
azureServiceBus   = "7.17.6"
azureIdentity     = "1.14.0"
flyway            = "11.7.2"

[libraries]
spring-boot-autoconfigure = { module = "org.springframework.boot:spring-boot-autoconfigure", version.ref = "springBoot" }
flyway-core               = { module = "org.flywaydb:flyway-core",                  version.ref = "flyway" }
spring-boot-autoconfigure-processor = { module = "org.springframework.boot:spring-boot-autoconfigure-processor", version.ref = "springBoot" }
spring-kafka       = { module = "org.springframework.kafka:spring-kafka",          version.ref = "springKafka" }
spring-rabbit      = { module = "org.springframework.amqp:spring-rabbit",          version.ref = "springRabbit" }
aws-sqs            = { module = "software.amazon.awssdk:sqs",                      version.ref = "awsSdk" }
aws-sns            = { module = "software.amazon.awssdk:sns",                      version.ref = "awsSdk" }
aws-s3             = { module = "software.amazon.awssdk:s3",                       version.ref = "awsSdk" }
gcs                = { module = "com.google.cloud:google-cloud-storage",            version.ref = "googleCloudStorage" }
minio              = { module = "io.minio:minio",                                   version = "8.5.7" }
jackson-databind   = { module = "com.fasterxml.jackson.core:jackson-databind",      version = "2.16.0" }
jakarta-validation = { module = "jakarta.validation:jakarta.validation-api",           version = "3.0.2" }
hibernate-validator = { module = "org.hibernate.validator:hibernate-validator",        version = "8.0.1.Final" }
azure-storage-blob = { module = "com.azure:azure-storage-blob",               version.ref = "azureStorageBlob" }
azure-messaging-servicebus = { module = "com.azure:azure-messaging-servicebus", version.ref = "azureServiceBus" }
azure-identity     = { module = "com.azure:azure-identity",                   version.ref = "azureIdentity" }
